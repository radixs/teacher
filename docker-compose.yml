services:
  backend:
    build:
      context: ./services/backend
    env_file:
      - .env
    environment:
      - FLOW_LOG_PATH=${FLOW_LOG_PATH:-/shared-logs/teacher-flow.log}
      - FLOW_EVENT_TOKEN=${FLOW_EVENT_TOKEN:-teacher-flow-events-local}
    depends_on:
      - elasticsearch
      - rag-orchestrator
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./services/backend/app:/var/www/html
      - ./services/backend/docker/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - ./infrastructure/demo-logs:/shared-logs
    networks:
      - appnet

  frontend:
    build:
      context: ./services/frontend
    env_file:
      - .env
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=${FRONTEND_VITE_API_BASE_URL:-http://localhost:8080/api/v1}
      - FRONTEND_INTERNAL_PORT=${FRONTEND_INTERNAL_PORT:-3000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./services/frontend/app:/usr/src/app
      - frontend_node_modules:/usr/src/app/node_modules
    networks:
      - appnet

  rag-orchestrator:
    build:
      context: ./services/rag-orchestrator
    env_file:
      - .env
    environment:
      - RAG_HOST=0.0.0.0
      - RAG_PORT=${RAG_API_PORT:-9000}
      - RAG_RELOAD=${RAG_RELOAD:-}
      - FLOW_LOG_PATH=${FLOW_LOG_PATH:-/shared-logs/teacher-flow.log}
      - FLOW_EVENT_PUSH_URL=http://backend:${BACKEND_INTERNAL_PORT:-8080}/api/v1/flow-events
      - FLOW_EVENT_TOKEN=${FLOW_EVENT_TOKEN:-teacher-flow-events-local}
    depends_on:
      - llm-engine
      - embedding-worker
      - search-agent
      - elasticsearch
    ports:
      - "${RAG_API_PORT:-9000}:9000"
    volumes:
      - ./services/rag-orchestrator/app:/usr/src/app/app
      - ./services/rag-orchestrator/config:/usr/src/app/config
      - ./infrastructure/demo-logs:/shared-logs
    networks:
      - appnet

  llm-engine:
    build:
      context: ./services/llm-engine
    env_file:
      - .env
    environment:
      - LLM_CONFIG_PATH=/config/config.yaml
      - HSA_OVERRIDE_GFX_VERSION=${HSA_OVERRIDE_GFX_VERSION:-10.3.0}
      - HIP_VISIBLE_DEVICES=${HIP_VISIBLE_DEVICES:-0}
      - FLOW_LOG_PATH=${FLOW_LOG_PATH:-/shared-logs/teacher-flow.log}
      - FLOW_EVENT_PUSH_URL=http://backend:${BACKEND_INTERNAL_PORT:-8080}/api/v1/flow-events
      - FLOW_EVENT_TOKEN=${FLOW_EVENT_TOKEN:-teacher-flow-events-local}
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
    security_opt:
      - seccomp:unconfined
    ports:
      - "${LLM_ENGINE_PORT:-8000}:8000"
    volumes:
      - ./services/llm-engine/config.yaml:/config/config.yaml:ro
      - llm_models:/models
      - ./infrastructure/demo-logs:/shared-logs
    networks:
      - appnet

  embedding-worker:
    build:
      context: ./services/embedding-worker
    env_file:
      - .env
    environment:
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME_OR_PATH:-BAAI/bge-base-en-v1.5}
      - EMBEDDING_PORT=${EMBEDDING_PORT:-9100}
      - FLOW_LOG_PATH=${FLOW_LOG_PATH:-/shared-logs/teacher-flow.log}
      - FLOW_EVENT_PUSH_URL=http://backend:${BACKEND_INTERNAL_PORT:-8080}/api/v1/flow-events
      - FLOW_EVENT_TOKEN=${FLOW_EVENT_TOKEN:-teacher-flow-events-local}
    ports:
      - "${EMBEDDING_PORT:-9100}:9100"
    volumes:
      - embedding_models:/models
      - ./infrastructure/demo-logs:/shared-logs
    networks:
      - appnet

  search-agent:
    build:
      context: ./services/search-agent
    env_file:
      - .env
    environment:
      - SEARCH_AGENT_PORT=${SEARCH_AGENT_PORT:-9205}
      - SEARCH_AGENT_REQUEST_INTERVAL_SECONDS=${DUCKDUCKGO_REQUEST_INTERVAL_SECONDS:-2.0}
      - SEARCH_AGENT_USER_AGENT=${DUCKDUCKGO_USER_AGENT:-teacher-app-bot/0.1}
      - FLOW_LOG_PATH=${FLOW_LOG_PATH:-/shared-logs/teacher-flow.log}
      - FLOW_EVENT_PUSH_URL=http://backend:${BACKEND_INTERNAL_PORT:-8080}/api/v1/flow-events
      - FLOW_EVENT_TOKEN=${FLOW_EVENT_TOKEN:-teacher-flow-events-local}
    ports:
      - "${SEARCH_AGENT_PORT:-9205}:9205"
    volumes:
      - ./infrastructure/demo-logs:/shared-logs
    networks:
      - appnet

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    volumes:
      - es_data:/usr/share/elasticsearch/data
      - ./infrastructure/elasticsearch/config:/usr/share/elasticsearch/config
      - ./infrastructure/elasticsearch/indices:/usr/share/elasticsearch/indices:ro
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
      - "${ELASTICSEARCH_TRANSPORT_PORT:-9300}:9300"
    networks:
      - appnet

  kibana:
    image: docker.elastic.co/kibana/kibana:9.1.4
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    networks:
      - appnet

volumes:
  es_data:
  frontend_node_modules:
  llm_models:
  embedding_models:

networks:
  appnet:
    driver: bridge
